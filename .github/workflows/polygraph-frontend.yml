# SPDX-License-Identifier: MPL-2.0
name: Polygraph Frontend

on:
  push:
    branches: [main]
    paths:
      - "polygraph/frontend/**"
      - ".github/workflows/polygraph-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "polygraph/frontend/**"
      - ".github/workflows/polygraph-frontend.yml"

permissions:
  contents: read

concurrency:
  group: polygraph-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: polygraph/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # package-lock.json is intentionally not committed in this estate. All
      # direct dependencies are exact versions in package.json and Deno's lock
      # file is kept as the lock for the Deno import graph.
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate GraphQL contract
        run: npm run test:graphql

      - name: ReScript type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      # npm audit requires a lockfile. The estate intentionally does not
      # commit package-lock.json, so create one only inside the runner.
      - name: Resolve ephemeral audit lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
