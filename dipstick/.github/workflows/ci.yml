# SPDX-License-Identifier: MPL-2.0-or-later
name: CI
on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/nuj-monitor
jobs:
  test-collector:
    name: Test Collector Service (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/collector/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run tests
        working-directory: services/collector
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test
  test-analyzer:
    name: Test Analyzer Service (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - name: Cache Python dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/analyzer/pyproject.toml') }}
      - name: Install dependencies
        working-directory: services/analyzer
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_lg
      - name: Run linters
        working-directory: services/analyzer
        run: |
          black --check .
          isort --check-only .
          mypy app/
      - name: Run tests
        working-directory: services/analyzer
        run: pytest
  test-publisher:
    name: Test Publisher Service (Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642195f2b846b8bbe245a93 # v4
        with:
          node-version: '20'
      - name: Cache Node modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: services/publisher/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('services/publisher/package-lock.json') }}
      - name: Install dependencies
        working-directory: services/publisher
        run: npm ci
      - name: Run linter
        working-directory: services/publisher
        run: npm run lint
      - name: Run tests
        working-directory: services/publisher
        run: npm test
  test-dashboard:
    name: Test Dashboard Service (Elixir)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124  # v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Cache Mix dependencies
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            services/dashboard/deps
            services/dashboard/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('services/dashboard/mix.lock') }}
      - name: Install dependencies
        working-directory: services/dashboard
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
      - name: Run tests
        working-directory: services/dashboard
        run: |
          mix format --check-formatted
          mix test
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-collector, test-analyzer, test-publisher, test-dashboard]
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [collector, analyzer, publisher, dashboard]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297  # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7  # v4.31.9
        with:
          sarif_file: 'trivy-results.sarif'
