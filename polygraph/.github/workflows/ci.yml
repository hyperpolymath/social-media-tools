# SPDX-License-Identifier: MPL-2.0
name: Polygraph Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: polygraph-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build and validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Validate GraphQL contract
        run: npm run test:graphql

      - name: ReScript type check
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      # npm audit requires a lockfile. The estate intentionally does not
      # commit package-lock.json, so create one only inside the runner.
      - name: Resolve ephemeral audit lock
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
