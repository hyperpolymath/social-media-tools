server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep the browser-facing GraphQL URL same-origin. In compose the backend
  # service is named backend; deployments can replace this upstream at the
  # outer reverse proxy without rebuilding the frontend.
  location = /graphql {
    proxy_pass http://backend:8000/graphql;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
